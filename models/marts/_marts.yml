version: 2

models:
  - name: dim_clients
    description: One row per client, with how many campaigns the agency has run for them.
    columns:
      - name: client_id
        tests: [unique, not_null]

  - name: dim_campaigns
    description: One row per campaign, joined to its client.
    columns:
      - name: campaign_id
        tests: [unique, not_null]

  - name: fct_ad_performance_daily
    description: >
      Daily spend, delivery and lead outcomes per campaign. Leads and won revenue
      are credited to the day the lead was created (cohort attribution), not the
      day the deal closed.
    columns:
      - name: campaign_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_campaigns')
                field: campaign_id
      - name: spend_zar
        tests: [non_negative]
      - name: won_revenue_zar
        tests: [non_negative]

  - name: mart_client_monthly_performance
    description: >
      Main reporting table. One row per client, channel and month with spend,
      leads, won revenue and the standard agency metrics.
    columns:
      - name: report_month
        tests: [not_null]
      - name: cost_per_lead_zar
        description: Spend divided by leads. Blank when a month had no leads.
      - name: return_on_ad_spend
        description: Won revenue divided by ad spend (excludes the agency retainer).

  - name: mart_channel_scorecard
    description: Channel performance per client segment, ranked by return on ad spend.
    columns:
      - name: roas_rank_in_segment
        description: 1 = best return on ad spend within the segment.
